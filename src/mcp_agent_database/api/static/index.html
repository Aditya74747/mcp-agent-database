<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcp-agent-database</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%232f5d50%22/%3E%3Cpath d=%22M9 22V10l7 7 7-7v12%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
    --accent: #2f5d50; --accent-ink: #ffffff; --warn: #9a5b00; --warn-bg: #fff6e6;
    --ok: #2f6d3a; --err: #a33a2c; --code: #f1efe8;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151615; --panel: #1d1f1d; --ink: #e9e8e3; --muted: #9b9a93; --line: #2e312e;
      --accent: #7fb7a4; --accent-ink: #0f1a16; --warn: #e6b45c; --warn-bg: #2a2416;
      --ok: #8cc79a; --err: #ec8b7d; --code: #252825;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
  .app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: 20px 18px; overflow-y: auto; }
  h1 { font: 600 17px/1 var(--mono); margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
  .status { font: 12px var(--mono); color: var(--muted); padding: 10px 0 16px; border-bottom: 1px solid var(--line); }
  .status b { color: var(--ink); font-weight: 600; }
  .server { margin-top: 16px; }
  .server h2 { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; }
  .tool { display: flex; justify-content: space-between; gap: 8px; font: 12.5px var(--mono); padding: 3px 0; }
  .tool .lock { color: var(--warn); font-size: 11px; white-space: nowrap; }
  .tool .ro { color: var(--muted); font-size: 11px; }
  main { display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 28px max(24px, calc((100% - 820px) / 2)); }
  .empty { color: var(--muted); margin-top: 12vh; text-align: center; }
  .empty button { display: block; margin: 8px auto; }
  .msg { margin: 0 0 18px; }
  .user { background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 12px 12px 2px 12px;
          margin-left: auto; max-width: 80%; width: fit-content; white-space: pre-wrap; }
  .answer { background: var(--panel); border: 1px solid var(--line); padding: 14px 18px; border-radius: 12px; }
  .answer p { margin: 0 0 10px; } .answer p:last-child { margin-bottom: 0; }
  .answer table { border-collapse: collapse; margin: 8px 0; font-size: 13.5px; }
  .answer th, .answer td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  code { font: 13px var(--mono); background: var(--code); padding: 1px 5px; border-radius: 4px; }
  pre { font: 12.5px/1.5 var(--mono); background: var(--code); padding: 10px 12px; border-radius: 8px;
        overflow-x: auto; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
  .thought { color: var(--muted); font-style: italic; margin: 0 0 10px; }
  details.tool-call { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin: 0 0 8px; }
  details.tool-call summary { cursor: pointer; padding: 8px 12px; font: 13px var(--mono); display: flex; gap: 10px; align-items: center; list-style: none; }
  details.tool-call summary::-webkit-details-marker { display: none; }
  details.tool-call .body { padding: 0 12px 12px; }
  .badge { font: 600 10.5px var(--mono); padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; text-transform: uppercase; letter-spacing: 0.04em; }
  .badge.ok { color: var(--ok); } .badge.error, .badge.denied { color: var(--err); } .badge.running { color: var(--muted); }
  .ms { color: var(--muted); margin-left: auto; font-size: 11.5px; }
  .approval { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 12px 14px; margin: 0 0 8px; }
  .approval .title { font-weight: 600; color: var(--warn); margin-bottom: 4px; }
  .approval .actions { display: flex; gap: 8px; margin-top: 10px; }
  .approval.resolved { opacity: 0.7; }
  button { font: 600 13px var(--sans); border-radius: 8px; padding: 7px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  form { display: flex; gap: 10px; padding: 14px max(24px, calc((100% - 820px) / 2)) 20px; border-top: 1px solid var(--line); background: var(--bg); }
  textarea { flex: 1; resize: none; font: 15px/1.4 var(--sans); padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-height: 46px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .err { color: var(--err); }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>mcp-agent-database</h1>
    <div class="sub">MCP servers + local agent with human approval</div>
    <div class="status" id="status">connecting…</div>
    <div id="tools"></div>
  </aside>
  <main>
    <div id="log">
      <div class="empty" id="empty">
        <p>Ask about the shop's data, policies or files. Try:</p>
        <button data-q="What was our revenue by category in 2025? Use the official revenue definition.">Revenue by category (2025)</button>
        <button data-q="Which country has the highest return rate, and what is our refund policy for headphones?">Return rates + refund policy</button>
        <button data-q="Write a short Q4 2025 revenue summary to reports/q4-summary.md">Write a report file (needs approval)</button>
      </div>
    </div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Message the agent…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const logEl = $("#log"), input = $("#input"), sendBtn = $("#send");
let sessionId = null;
let token = null;
try { token = localStorage.getItem("agentdb_token"); } catch (_) {}

function headers(extra = {}) {
  const h = { "Content-Type": "application/json", ...extra };
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function pretty(s) { try { return JSON.stringify(JSON.parse(s), null, 2); } catch (_) { return s; } }

// Minimal, safe Markdown: escape first, then add code, bold, lists, tables, paragraphs.
function md(text) {
  const blocks = esc(text || "").split(/\n{2,}/);
  return blocks.map((b) => {
    if (/^```/.test(b)) return "<pre>" + b.replace(/^```\w*\n?|```$/g, "") + "</pre>";
    const lines = b.split("\n");
    if (lines.length > 1 && lines.every((l) => l.trim().startsWith("|"))) {
      const rows = lines.filter((l) => !/^\s*\|?\s*:?-{2,}/.test(l));
      return "<table>" + rows.map((r, i) => "<tr>" + r.trim().replace(/^\||\|$/g, "").split("|")
        .map((c) => (i ? "<td>" : "<th>") + inline(c.trim()) + (i ? "</td>" : "</th>")).join("") + "</tr>").join("") + "</table>";
    }
    if (lines.every((l) => /^\s*([-*]|\d+\.)\s/.test(l))) {
      return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*([-*]|\d+\.)\s/, "")) + "</li>").join("") + "</ul>";
    }
    return "<p>" + inline(b).replace(/\n/g, "<br>") + "</p>";
  }).join("");
}
function inline(s) { return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }

function add(html, cls = "msg", tag = "div") {
  $("#empty")?.remove();
  const el = document.createElement(tag);
  el.className = cls; el.innerHTML = html;
  logEl.appendChild(el); logEl.scrollTop = logEl.scrollHeight;
  return el;
}

async function loadMeta() {
  try {
    const h = await (await fetch("/health")).json();
    $("#status").innerHTML = `model <b>${esc(h.model)}</b> · ${esc(h.provider)}<br>servers <b>${h.servers.map(esc).join(", ")}</b><br>approval <b>${esc(h.approval_mode)}</b>`;
    const res = await fetch("/v1/tools", { headers: headers() });
    if (res.status === 401) {
      const t = prompt("API token");
      if (t) { token = t; try { localStorage.setItem("agentdb_token", t); } catch (_) {} return loadMeta(); }
      return;
    }
    const tools = await res.json(), by = {};
    tools.forEach((t) => (by[t.server] ??= []).push(t));
    $("#tools").innerHTML = Object.entries(by).map(([srv, ts]) => `<div class="server"><h2>${esc(srv)}</h2>` +
      ts.map((t) => `<div class="tool" title="${esc(t.description)}"><span>${esc(t.name.split("__")[1])}</span>` +
        (t.requires_approval ? `<span class="lock">needs approval</span>` : `<span class="ro">read-only</span>`) + "</div>").join("") + "</div>").join("");
  } catch (e) { $("#status").innerHTML = `<span class="err">API unreachable</span>`; }
}

const calls = {};
function onEvent(type, d) {
  if (type === "session") sessionId = d.session_id;
  else if (type === "assistant_text") add(`<p class="thought">${esc(d.content)}</p>`);
  else if (type === "tool_call") {
    const el = add(`<summary><span class="badge running">running</span><span>${esc(d.name)}</span><span class="ms"></span></summary>
      <div class="body"><pre>${esc(JSON.stringify(d.arguments, null, 2))}</pre><div class="result"></div></div>`, "tool-call", "details");
    calls[d.id] = el;
  } else if (type === "approval_required") {
    const el = add(`<div class="title">Approval needed: ${esc(d.tool)}</div><div>${esc(d.reason)}</div>
      <pre>${esc(JSON.stringify(d.arguments, null, 2))}</pre>
      <div class="actions"><button class="primary" data-ok="1">Approve</button><button data-ok="0">Deny</button></div>`, "approval");
    el.querySelectorAll("button").forEach((b) => b.onclick = async () => {
      el.querySelectorAll("button").forEach((x) => (x.disabled = true));
      await fetch(`/v1/approvals/${d.id}`, { method: "POST", headers: headers(), body: JSON.stringify({ approved: b.dataset.ok === "1" }) });
    });
    el.dataset.id = d.id;
  } else if (type === "approval_decision") {
    const el = document.querySelector(`.approval[data-id="${d.id}"]`);
    if (el) { el.classList.add("resolved"); el.querySelector(".actions").innerHTML = d.approved ? "✓ approved" : "✕ denied"; }
  } else if (type === "tool_result") {
    const det = calls[d.id]; if (!det) return;
    det.querySelector(".badge").className = "badge " + d.status; det.querySelector(".badge").textContent = d.status;
    det.querySelector(".ms").textContent = d.duration_ms ? `${Math.round(d.duration_ms)} ms` : "";
    det.querySelector(".result").innerHTML = `<pre>${esc(pretty(d.content))}</pre>`;
  } else if (type === "final") add(md(d.content), "msg answer");
  else if (type === "error") add(`<span class="err">${esc(d.message)}</span>`, "msg answer");
}

async function send(text) {
  if (!text.trim()) return;
  add(esc(text), "msg user");
  input.value = ""; sendBtn.disabled = true;
  try {
    const res = await fetch("/v1/chat", { method: "POST", headers: headers({ Accept: "text/event-stream" }),
      body: JSON.stringify({ message: text, session_id: sessionId }) });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true }).replace(/\r\n/g, "\n");
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = "message", data = "";
        chunk.split("\n").forEach((l) => { if (l.startsWith("event:")) ev = l.slice(6).trim(); else if (l.startsWith("data:")) data += l.slice(5).trim(); });
        if (data) onEvent(ev, JSON.parse(data));
      }
    }
  } catch (e) { add(`<span class="err">${esc(e.message)}</span>`, "msg answer"); }
  sendBtn.disabled = false; input.focus();
}

$("#form").onsubmit = (e) => { e.preventDefault(); send(input.value); };
input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); } };
document.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => send(b.dataset.q));
loadMeta();
</script>
</body>
</html>
